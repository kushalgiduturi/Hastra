<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra — Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#07070f; --ground-2:#111233; --card:rgba(16,17,36,.55); --card-border:rgba(245,166,35,.22);
    --amber:#f5a623; --amber-bright:#ffc35c; --violet:#6d5ce7;
    --text:#eef0ff; --dim:#8b8fb8; --faint:#4a4d73;
    --line:rgba(238,240,255,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text); font-family:'Inter',sans-serif; overflow:hidden; position:relative;
    background:
      radial-gradient(1px 1px at 10% 20%, #fff 0, transparent 100%),
      radial-gradient(1px 1px at 80% 15%, #fff 0, transparent 100%),
      radial-gradient(1px 1px at 60% 70%, #fff 0, transparent 100%),
      radial-gradient(1px 1px at 30% 85%, #fff 0, transparent 100%),
      radial-gradient(1px 1px at 90% 60%, #fff 0, transparent 100%),
      radial-gradient(1px 1px at 45% 40%, #fff 0, transparent 100%),
      radial-gradient(ellipse 70% 50% at 30% 15%, rgba(109,92,231,.16), transparent 60%),
      radial-gradient(ellipse 60% 50% at 75% 80%, rgba(245,166,35,.10), transparent 60%),
      linear-gradient(180deg, var(--ground) 0%, var(--ground-2) 100%);
    background-size: 200px 200px,220px 220px,190px 190px,210px 210px,230px 230px,180px 180px,100% 100%,100% 100%,100% 100%;
  }
  .stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}

  .hand-wrap{position:absolute; top:50%; left:50%; width:680px; height:680px; margin:-340px 0 0 -340px; pointer-events:none;}

  .glow{position:absolute; inset:-75px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,195,92,.30) 0%, transparent 65%);
    opacity:0; filter:blur(20px);
    animation: glowIn 1.5s .5s cubic-bezier(.16,1,.3,1) forwards, glowBreathe 3.4s 2.4s ease-in-out infinite alternate;}
  @keyframes glowIn{ to{opacity:.5} }
  @keyframes glowBreathe{ from{opacity:.38; transform:scale(1)} to{opacity:.58; transform:scale(1.045)} }

  .pulse{position:absolute; left:50%; top:57%; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%;
    border:1.5px solid var(--amber-bright); opacity:0; pointer-events:none;
    animation: pulseOut 1.35s cubic-bezier(.2,.7,.2,1) forwards;}
  .pulse.p1{animation-delay:1.75s}
  .pulse.p2{animation-delay:2.05s}
  @keyframes pulseOut{ 0%{width:10px;height:10px;margin:-5px 0 0 -5px; opacity:.8} 100%{width:340px;height:340px;margin:-170px 0 0 -170px; opacity:0} }


  .card{width:min(400px,88vw); background:var(--card); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--card-border); border-radius:12px; padding:2.3rem 2.1rem 1.9rem;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.65), 0 0 40px -14px rgba(245,166,35,.2);
    opacity:0; transform:translateY(4px) scale(.32); filter:blur(15px);
    animation: cardEmerge 1.1s 2.25s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes cardEmerge{to{opacity:1; transform:translateY(0) scale(1); filter:blur(0)}}

  .brand{display:flex; align-items:center; gap:10px; margin-bottom:1.6rem;}
  .brand svg{width:24px;height:24px}
  .brand span{font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:600; letter-spacing:.01em;}
  h1{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:600; margin:0 0 4px;}
  p.sub{margin:0 0 1.7rem; color:var(--dim); font-size:12.5px; font-family:'JetBrains Mono',monospace;}
  label{display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--dim); margin:0 0 6px;}
  .field{margin-bottom:1.1rem;}
  input{width:100%; background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:7px; color:var(--text);
    font-family:'Inter',sans-serif; font-size:14px; padding:11px 13px; outline:none; transition:border-color .2s, box-shadow .2s;}
  input:focus{border-color:var(--amber); box-shadow:0 0 0 3px rgba(245,166,35,.15);}
  button{width:100%; margin-top:.6rem; background:linear-gradient(135deg,var(--amber-bright),var(--amber)); color:#241503; border:none;
    border-radius:7px; padding:12px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; letter-spacing:.02em; cursor:pointer;
    box-shadow:0 8px 26px -8px rgba(245,166,35,.55); transition:transform .15s, box-shadow .15s;}
  button:hover{transform:translateY(-1px); box-shadow:0 12px 30px -8px rgba(245,166,35,.7);}
  .foot{margin-top:1.4rem; text-align:center; font-size:12px; color:var(--faint);}
  .foot a{color:var(--amber); text-decoration:none;}
  .label-tag{position:fixed; bottom:18px; left:18px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; z-index:5;}
</style>
</head>
<body>
<div class="label-tag">C — Astra Mission Control</div>
<div class="stage">
  <div class="hand-wrap">
  <div class="glow"></div>
  <div class="pulse p1"></div>
  <div class="pulse p2"></div>
  </div>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path fill="var(--amber-bright)" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
      <span>Astra</span>
    </div>
    <h1>Mission access</h1>
    <p class="sub">// identity verification required</p>
    <div class="field"><label>Email</label><input type="email" placeholder="you@company.com"></div>
    <div class="field"><label>Password</label><input type="password" placeholder="••••••••••"></div>
    <button>Sign in</button>
    <div class="foot">Forgot your password? <a href="#">Reset it</a></div>
  </div>
</div>
<script>
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.querySelectorAll('.pulse').forEach(b=>b.style.display='none');
    document.querySelector('.glow').style.cssText='opacity:.5;animation:none';
    document.querySelector('.card').style.cssText='opacity:1;transform:none;filter:none';
  }
</script>
</body>
</html>
