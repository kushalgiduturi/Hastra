<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra — Refined Classic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#0b0e16; --ground-2:#0e1220; --card:rgba(20,25,38,.55); --card-border:rgba(201,162,39,.22);
    --gold:#c9a227; --gold-bright:#e4c25c; --gold-dim:#8a6f22;
    --text:#f3ede0; --dim:#a79f8c; --faint:#6b6455;
    --line:rgba(243,237,224,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(201,162,39,.10), transparent 60%),
      linear-gradient(180deg, var(--ground) 0%, var(--ground-2) 100%);
    color:var(--text); font-family:'Inter',sans-serif; overflow:hidden; position:relative;
  }
  .stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}

  /* hand: fades in, palm pulses, then login card emerges from its center */
  .hand-wrap{position:absolute; top:50%; left:50%; width:640px; height:640px; margin:-320px 0 0 -320px; pointer-events:none;}

  .glow{position:absolute; inset:-70px; border-radius:50%;
    background: radial-gradient(circle, rgba(228,194,92,.30) 0%, transparent 65%);
    opacity:0; filter:blur(18px);
    animation: glowIn 1.4s .4s cubic-bezier(.16,1,.3,1) forwards, glowBreathe 3.4s 2.1s ease-in-out infinite alternate;}
  @keyframes glowIn{ to{opacity:.5} }
  @keyframes glowBreathe{ from{opacity:.38; transform:scale(1)} to{opacity:.58; transform:scale(1.045)} }

  .pulse{position:absolute; left:50%; top:57%; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%;
    border:1.5px solid var(--gold-bright); opacity:0; pointer-events:none;
    animation: pulseOut 1.3s cubic-bezier(.2,.7,.2,1) forwards;}
  .pulse.p1{animation-delay:1.5s}
  .pulse.p2{animation-delay:1.8s}
  @keyframes pulseOut{ 0%{width:10px;height:10px;margin:-5px 0 0 -5px; opacity:.75} 100%{width:320px;height:320px;margin:-160px 0 0 -160px; opacity:0} }


  .card{width:min(400px,88vw); background:var(--card); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--card-border); border-radius:10px; padding:2.4rem 2.2rem 2rem;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.02) inset;
    opacity:0; transform:translateY(4px) scale(.32); filter:blur(14px);
    animation: cardEmerge 1.05s 2.0s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes cardEmerge{to{opacity:1; transform:translateY(0) scale(1); filter:blur(0)}}

  .brand{display:flex; align-items:center; gap:10px; margin-bottom:1.6rem;}
  .brand svg{width:26px;height:26px}
  .brand span{font-family:'Playfair Display',serif; font-size:22px; letter-spacing:.02em; font-weight:600;}
  h1{font-family:'Playfair Display',serif; font-size:20px; font-weight:600; margin:0 0 4px; letter-spacing:.01em;}
  p.sub{margin:0 0 1.8rem; color:var(--dim); font-size:13px; font-style:italic; font-family:'Cormorant Garamond',serif; font-size:16px;}
  label{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:0 0 6px;}
  .field{margin-bottom:1.1rem;}
  input{width:100%; background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:6px; color:var(--text);
    font-family:'Inter',sans-serif; font-size:14px; padding:11px 13px; outline:none; transition:border-color .2s, box-shadow .2s;}
  input:focus{border-color:var(--gold-dim); box-shadow:0 0 0 3px rgba(201,162,39,.12);}
  button{width:100%; margin-top:.6rem; background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#1a1408; border:none;
    border-radius:6px; padding:12px; font-family:'Inter',sans-serif; font-weight:600; font-size:13px; letter-spacing:.03em; cursor:pointer;
    box-shadow:0 8px 24px -8px rgba(201,162,39,.5); transition:transform .15s, box-shadow .15s;}
  button:hover{transform:translateY(-1px); box-shadow:0 12px 28px -8px rgba(201,162,39,.65);}
  .foot{margin-top:1.4rem; text-align:center; font-size:12px; color:var(--faint);}
  .foot a{color:var(--gold-dim); text-decoration:none;}
  .label-tag{position:fixed; bottom:18px; left:18px; font-family:'Inter'; font-size:11px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; z-index:5;}
</style>
</head>
<body>
<div class="label-tag">A — Refined SaaS Classic</div>
<div class="stage">
  <div class="hand-wrap">
  <div class="glow"></div>
  <div class="pulse p1"></div>
  <div class="pulse p2"></div>
  </div>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path fill="var(--gold-bright)" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
      <span>Astra</span>
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to continue to your workspace</p>
    <div class="field"><label>Email</label><input type="email" placeholder="you@company.com"></div>
    <div class="field"><label>Password</label><input type="password" placeholder="••••••••••"></div>
    <button>Sign in</button>
    <div class="foot">Forgot your password? <a href="#">Reset it</a></div>
  </div>
</div>
<script>
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.querySelectorAll('.pulse').forEach(b=>b.style.display='none');
    document.querySelector('.glow').style.cssText='opacity:.5;animation:none';
    document.querySelector('.card').style.cssText='opacity:1;transform:none;filter:none';
  }
</script>
</body>
</html>
