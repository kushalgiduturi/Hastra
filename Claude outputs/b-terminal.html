<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra — Polished Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#060a12; --ground-2:#0a0f1e; --card:rgba(12,18,30,.6); --card-border:rgba(34,211,238,.22);
    --cyan:#22d3ee; --cyan-bright:#7dfcff; --green:#22c55e;
    --text:#e8f4f6; --dim:#7fa3ac; --faint:#3f5a62;
    --line:rgba(232,244,246,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text); font-family:'Inter',sans-serif; overflow:hidden; position:relative;
    background:
      repeating-linear-gradient(180deg, rgba(34,211,238,.025) 0px, rgba(34,211,238,.025) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(34,211,238,.08), transparent 60%),
      linear-gradient(180deg, var(--ground) 0%, var(--ground-2) 100%);
  }
  .stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}

  .hand-wrap{position:absolute; top:50%; left:50%; width:640px; height:640px; margin:-320px 0 0 -320px; pointer-events:none;}

  .glow{position:absolute; inset:-70px; border-radius:50%;
    background: radial-gradient(circle, rgba(125,252,255,.32) 0%, transparent 65%);
    opacity:0; filter:blur(18px);
    animation: glowIn 1.3s .35s cubic-bezier(.16,1,.3,1) forwards, glowBreathe 3s 1.9s ease-in-out infinite alternate;}
  @keyframes glowIn{ to{opacity:.55} }
  @keyframes glowBreathe{ from{opacity:.42; transform:scale(1)} to{opacity:.62; transform:scale(1.045)} }

  .pulse{position:absolute; left:50%; top:57%; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%;
    border:1.5px solid var(--cyan-bright); opacity:0; pointer-events:none;
    animation: pulseOut 1.15s cubic-bezier(.2,.7,.2,1) forwards;}
  .pulse.p1{animation-delay:1.3s}
  .pulse.p2{animation-delay:1.58s}
  @keyframes pulseOut{ 0%{width:10px;height:10px;margin:-5px 0 0 -5px; opacity:.8} 100%{width:300px;height:300px;margin:-150px 0 0 -150px; opacity:0} }


  .card{width:min(400px,88vw); background:var(--card); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--card-border); border-radius:6px; padding:2.2rem 2rem 1.8rem;
    box-shadow:0 0 0 1px rgba(34,211,238,.06), 0 30px 70px -20px rgba(0,0,0,.7), 0 0 40px -12px rgba(34,211,238,.25);
    opacity:0; transform:translateY(4px) scale(.32); filter:blur(13px);
    animation: cardEmerge .9s 1.75s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes cardEmerge{to{opacity:1; transform:translateY(0) scale(1); filter:blur(0)}}

  .brand{display:flex; align-items:center; gap:9px; margin-bottom:1.5rem;}
  .brand svg{width:22px;height:22px}
  .brand span{font-family:'Share Tech Mono',monospace; font-size:19px; letter-spacing:.06em; color:var(--cyan-bright);}
  h1{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:500; margin:0 0 4px; color:var(--text);}
  h1::before{content:'> '; color:var(--green);}
  p.sub{margin:0 0 1.7rem; color:var(--dim); font-size:12px; font-family:'JetBrains Mono',monospace;}
  label{display:block; font-family:'Share Tech Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:0 0 6px;}
  .field{margin-bottom:1.05rem;}
  input{width:100%; background:rgba(255,255,255,.025); border:1px solid var(--line); border-radius:4px; color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:13px; padding:10px 12px; outline:none; transition:border-color .2s, box-shadow .2s;}
  input:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(34,211,238,.14);}
  button{width:100%; margin-top:.5rem; background:var(--cyan); color:#031014; border:none;
    border-radius:4px; padding:11px; font-family:'Share Tech Mono',monospace; font-weight:400; font-size:13px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
    box-shadow:0 0 24px -6px rgba(34,211,238,.6); transition:transform .15s, box-shadow .15s;}
  button:hover{transform:translateY(-1px); box-shadow:0 0 32px -4px rgba(34,211,238,.8);}
  .foot{margin-top:1.3rem; text-align:center; font-size:11px; color:var(--faint); font-family:'JetBrains Mono',monospace;}
  .foot a{color:var(--cyan);}
  .label-tag{position:fixed; bottom:18px; left:18px; font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; z-index:5;}
</style>
</head>
<body>
<div class="label-tag">B — Polished Terminal</div>
<div class="stage">
  <div class="hand-wrap">
  <div class="glow"></div>
  <div class="pulse p1"></div>
  <div class="pulse p2"></div>
  </div>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path fill="var(--cyan-bright)" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
      <span>ASTRA</span>
    </div>
    <h1>authenticate</h1>
    <p class="sub">// secure session · OTP required</p>
    <div class="field"><label>Email</label><input type="email" placeholder="you@company.com"></div>
    <div class="field"><label>Password</label><input type="password" placeholder="••••••••••"></div>
    <button>Sign in</button>
    <div class="foot">forgot password? <a href="#">reset →</a></div>
  </div>
</div>
<script>
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.querySelectorAll('.pulse').forEach(b=>b.style.display='none');
    document.querySelector('.glow').style.cssText='opacity:.55;animation:none';
    document.querySelector('.card').style.cssText='opacity:1;transform:none;filter:none';
  }
</script>
</body>
</html>
